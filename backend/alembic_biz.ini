# Biz DB (scm_biz) standalone Alembic config (W24 Day1 dual migration chains).
# Run inside backend/:
#   python -X utf8 -m alembic -c alemic_biz.ini upgrade head
# NOTE: fully isolated from the platform chain (alembic.ini).

[alembic]
# path to migration scripts.
script_location = %(here)s/alembic_biz

# prepend_sys_path = .
prepend_sys_path = .

# version location specification (single dir, biz chain only)
version_locations = %(here)s/alembic_biz/versions
path_separator = ;

# Database URL. Consumed by env.py only (overridden by app.platform.settings).
sqlalchemy.url = mysql+asyncmy://root:root123@127.0.0.1:13306/scm_biz?charset=utf8mb4

[post_write_hooks]
# hooks = ruff

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
