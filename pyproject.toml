[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scm-copilot"
version = "0.1.0"
description = "SCM Copilot 供应链智能运营平台（阶段四）——模块化单体生产平台"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncmy",
    "alembic",
    "bcrypt",
    "pyjwt",
    "cryptography",          # asyncmy 连 MySQL8 caching_sha2_password 认证必需
    "pydantic-settings",
    "httpx",                 # fastapi TestClient 依赖（测试经 dev extra 安装）
    # ---- W23 Day4 双域并入：kb（stage3-a）所需 ----
    "qdrant-client",         # kb 向量检索（Qdrant）
    "numpy",
    "jieba",                 # kb BM25 中文分词
    "pdfplumber",            # kb 文档解析（.pdf）
    "python-docx",           # kb 文档解析（.docx）
    # ---- W23 Day4 双域并入：ops（stage3-b）所需 ----
    "langgraph",             # ops 业务 Agent 图（含 checkpoint）
    "langgraph-checkpoint-sqlite",
    "aiosqlite",             # AsyncSqliteSaver 依赖（SQLite 回退后端）
    "langgraph-checkpoint-mysql",   # ★ W23 Day5：AsyncMySaver（MySQL 权威库 checkpointer）
    "asyncmy",               # asyncmy 驱动（SQLAlchemy + AsyncMySaver 共用）
    "pymysql",               # ★ W23 Day5：审批服务 MySQL 同步驱动（approval.py）
    "redis",                 # ops 幂等/缓存/锁（fail-open）
    "rq",                    # ops 报表异步任务队列
    # ---- 共享观测（obs）：Prometheus + OpenTelemetry ----
    "prometheus-client",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-exporter-otlp-proto-http",
    "mcp",                   # kb MCP 工具（按需）
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

# 包发现：backend/ 下只有 app* 是可安装包（tests 不打包）；
# 不声明会导致 setuptools 自动发现撞上 backend/deploy/docs 多顶层目录而失败
[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

# ==================== ruff（lint + format） ====================
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]
# alembic/versions 是自动生成的迁移代码，不参与 lint/format（模板自带 Union 等旧风格）
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
# 生产级规则集（面试可讲）：E/F = 核心错误，W = 警告，UP = pyupgrade，
# B = bugbear 常见坑，I = isort 导入排序，SIM = 简化
select = ["E", "F", "W", "UP", "B", "I", "SIM"]
ignore = [
    "E402",   # 模块级 import 非顶部（sys.path hack 常见，项目惯例）
    "E501",   # 行长交给 formatter（ruff format）
    "F401",   # import 未使用（模块级 re-export noqa 已标注，减少噪音）
    "B008",   # Depends(...) 作默认参数（FastAPI 依赖注入是标准用法）
]

# ==================== mypy（类型检查） ====================
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
explicit_package_bases = true
namespace_packages = true
# scripts/（seed 等）import app.* 需要 backend 在解析路径上
mypy_path = ["backend"]
exclude = [
    "deploy/",
]



# ==================== pytest + coverage ====================
[tool.pytest.ini_options]
# 单包布局：backend 是包根（from app.xxx import ...），pythonpath 兜底
testpaths = ["backend/tests"]
pythonpath = ["backend"]
# 评测/集成类打 tag 跳过——CI 里不下载模型不烧 token（手册坑）
markers = [
    "llm: 需要真实 LLM/网络（CI 跳过，留本地跑）",
    "model: 需要模型下载/推理（CI 跳过，留本地跑）",
    "integration: 需要外部服务（MySQL/Redis/Qdrant/mock）（按需跑）",
]
addopts = "-q --disable-warnings"
# async 测试自动收集（pytest-asyncio auto 模式，否则 async def 测试不被支持）
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["backend"]
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 0          # 本周目标=有报告；下门槛留到 W24
