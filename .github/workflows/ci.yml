# ★ W23 Day1：SCM Copilot CI 流水线：push/PR → Python 3.12 → ruff → mypy → pytest → coverage
#
# 设计（沿用 stage3 W21 经验）：
# - MySQL service container：端口映射到 job 容器本机 127.0.0.1:3306（实测 DNS 无法
#   解析 service 名 `mysql`，手册的"service 名即 host"在 GH Actions 不成立）
#   → 连通性用例用 SCM_TEST_DSN=mysql+asyncmy://root:root123@127.0.0.1:3306/... 覆盖
# - CI 不做模型下载/网络访问（integration 以外的用例必须离线可跑）
# - coverage 生成 XML 报告上传
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: scm_platform
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"   # 依赖唯一来源 = pyproject.toml，避免双清单漂移

      - name: ruff lint
        run: ruff check backend scripts

      - name: mypy
        run: mypy --explicit-package-bases --namespace-packages backend scripts

      # 平台库 schema 合法 + 种子可重放（保证 PR 合并前 schema 一定可用）
      - name: alembic migrate + seed
        run: |
          SCM_PLATFORM_DSN="mysql+asyncmy://root:root123@127.0.0.1:3306/scm_platform?charset=utf8mb4" \
            alembic -c backend/alembic.ini upgrade head
          SCM_PLATFORM_DSN="mysql+asyncmy://root:root123@127.0.0.1:3306/scm_platform?charset=utf8mb4" \
            python scripts/seed_platform.py
          # 幂等验证：seed 跑两遍结果一致（无重复告警即过）
          SCM_PLATFORM_DSN="mysql+asyncmy://root:root123@127.0.0.1:3306/scm_platform?charset=utf8mb4" \
            python scripts/seed_platform.py

      - name: pytest + coverage
        run: |
          SCM_TEST_DSN="mysql+asyncmy://root:root123@127.0.0.1:3306/scm_platform?charset=utf8mb4" \
          pytest backend/tests -v \
            --cov=backend --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage.xml
          if-no-files-found: error
