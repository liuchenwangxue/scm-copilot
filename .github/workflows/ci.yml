# ★ W23 Day1：SCM Copilot CI 流水线：push/PR → Python 3.12 → ruff → mypy → pytest → coverage
#
# 设计（沿用 stage3 W21 经验）：
# - MySQL service container：端口映射到 job 容器本机 127.0.0.1:3306（实测 DNS 无法
#   解析 service 名 `mysql`，手册的"service 名即 host"在 GH Actions 不成立）
#   → 连通性用例用 SCM_TEST_DSN=mysql+asyncmy://root:root123@127.0.0.1:3306/... 覆盖
# - CI 不做模型下载/网络访问（integration 以外的用例必须离线可跑）
# - coverage 生成 XML 报告上传
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: scm_platform
          TZ: Asia/Shanghai
        # ★ W24 教训：不要用 volumes 挂载工作区子目录（如 deploy/initdb）到 service 容器！
        #   容器内 root 会改写目录所有权 → 重跑时 actions/checkout 清理工作区报
        #   EACCES 删除失败。建 scm_biz/只读账号改由 job 步骤显式跑 scripts/init_biz_db.py。
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"   # 依赖唯一来源 = pyproject.toml，避免双清单漂移

      - name: ruff lint
        run: ruff check backend scripts

      - name: mypy
        run: mypy --explicit-package-bases --namespace-packages backend scripts

      # ★ W24 Day2：NL2SQL 四道闸 + 攻击用例快速安全回归（纯 AST 逻辑，无需 DB，
      #   在数据库步骤之前跑——安全防线是 CI 的第一道闸）
      - name: sql_validator + attack cases
        run: |
          python -m pytest backend/tests/test_sql_validator.py backend/tests/test_attack_cases.py -q

      # ★ W24 Day3：NL2SQL 生成链路快速验证（纯逻辑，无需 DB）：
      #   prompt 模板可构建、mock 生成器可加载评测集
      - name: nl2sql prompts + mock generator sanity
        run: |
          python -X utf8 -c "from app.domains.data.prompts import build_nl2sql_messages; msgs=build_nl2sql_messages('华东区域有多少订单？'); assert len(msgs)==2 and 'orders' in msgs[1]['content']"
          python -X utf8 -c "from app.domains.data.mock_sql import MockSQLGenerator; g=MockSQLGenerator(); assert g.loaded_count>=100; print('mock gen loaded', g.loaded_count)"

      # ★ W25 Day6：工具钩子 sanity——注册表/审计/参数校验/缓存失效/diff 复用（纯逻辑，无 DB）
      - name: hooks sanity
        run: |
          python -m pytest backend/tests/test_hooks.py -q

      # ★ W24 Day4/Day6：Schema Linking v2 prompt sanity（显式传 tables → 不触发 embedding 模型下载，CI 离线）
      #   验证：v2 模板可构建 + few-shot 与召回表联动 + 评测集 100 条三层合法 + 洞察数字溯源
      - name: schema linker v2 prompt + eval set + insight sanity
        run: |
          python -X utf8 -c "from app.domains.data.prompts import build_nl2sql_messages_v2; msgs=build_nl2sql_messages_v2('华东区域有多少订单？', tables=['orders']); assert len(msgs)==2 and 'orders' in msgs[1]['content'] and '示例（' in msgs[1]['content']; print('v2 prompt ok', len(msgs[1]['content']))"
          python -X utf8 -c "import json; from collections import Counter; lines=[l for l in open('backend/evals/nl2sql_eval_v1.jsonl',encoding='utf-8') if l.strip()]; assert len(lines)==100; ids=[json.loads(l)['id'] for l in lines]; assert ids==sorted(ids) and len(set(ids))==100; layers=Counter(json.loads(l)['layer'] for l in lines); assert layers=={'single':40,'join':40,'aggregation':20}; print('eval set 100 ok', dict(layers))"
          python -X utf8 -c "from app.domains.data.insight import verify_insight_digits, _result_numeric_values; assert verify_insight_digits('金额 1234567.89', [1234567.89]) and not verify_insight_digits('金额 999', [1234567.89]); assert 44.0 in _result_numeric_values(['name'], [['华东宏图44有限公司']]); print('insight digits ok')"

      # 平台库 schema 合法 + 种子可重放（保证 PR 合并前 schema 一定可用）
      - name: alembic migrate + seed (platform)
        run: |
          SCM_PLATFORM_DSN="mysql+asyncmy://root:root123@127.0.0.1:3306/scm_platform?charset=utf8mb4" \
            alembic -c backend/alembic.ini upgrade head
          SCM_PLATFORM_DSN="mysql+asyncmy://root:root123@127.0.0.1:3306/scm_platform?charset=utf8mb4" \
            python scripts/seed_platform.py
          # 幂等验证：seed 跑两遍结果一致（无重复告警即过）
          SCM_PLATFORM_DSN="mysql+asyncmy://root:root123@127.0.0.1:3306/scm_platform?charset=utf8mb4" \
            python scripts/seed_platform.py

      # ★ W24：业务库 scm_biz 迁移 + seed（独立链）+ 只读沙箱校验和
      # 先跑 init_biz_db.py 建 scm_biz 库 + nl2sql_ro 只读账号（替代 service volumes 挂载）
      - name: alembic migrate + seed (biz scm_biz)
        run: |
          SCM_BIZ_DSN="mysql+asyncmy://root:root123@127.0.0.1:3306/scm_biz?charset=utf8mb4" \
            python -X utf8 scripts/init_biz_db.py
          SCM_BIZ_DSN="mysql+asyncmy://root:root123@127.0.0.1:3306/scm_biz?charset=utf8mb4" \
            alembic -c backend/alembic_biz.ini upgrade head
          SCM_BIZ_DSN="mysql+asyncmy://root:root123@127.0.0.1:3306/scm_biz?charset=utf8mb4" \
            python -X utf8 scripts/seed_biz.py
          # 重放一致性：seed 跑两遍，校验和应一致（seed 脚本内含 check 输出）
          SCM_BIZ_DSN="mysql+asyncmy://root:root123@127.0.0.1:3306/scm_biz?charset=utf8mb4" \
            python -X utf8 scripts/seed_biz.py --check

      - name: pytest + coverage
        run: |
          SCM_TEST_DSN="mysql+asyncmy://root:root123@127.0.0.1:3306/scm_platform?charset=utf8mb4" \
          SCM_BIZ_DSN="mysql+asyncmy://root:root123@127.0.0.1:3306/scm_biz?charset=utf8mb4" \
          SCM_BIZ_RO_DSN="mysql+asyncmy://nl2sql_ro:ro_pass_2026_dev@127.0.0.1:3306/scm_biz?charset=utf8mb4" \
          pytest backend/tests -v \
            --cov=backend --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage.xml
          if-no-files-found: error

  # ★ W25 Day5：SDK job——装包 → 起平台 → 跑 SDK 单元 + 集成测试
  #   - 集成测试需要真实平台（uvicorn 后台）与 MySQL（admin 凭证创建 API Key）
  #   - 无 Redis → 限速 fail-open → 429 用例自动 skip（部署环境验证；与后端设计一致）
  sdk:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: scm_platform
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"       # 平台依赖（唯一来源 = pyproject.toml）
          pip install -e ./sdk          # SDK 可编辑安装（测试其真实导入路径）

      - name: alembic migrate + seed (platform & biz)
        run: |
          SCM_PLATFORM_DSN="mysql+asyncmy://root:root123@127.0.0.1:3306/scm_platform?charset=utf8mb4" \
            alembic -c backend/alembic.ini upgrade head
          SCM_PLATFORM_DSN="mysql+asyncmy://root:root123@127.0.0.1:3306/scm_platform?charset=utf8mb4" \
            python scripts/seed_platform.py
          SCM_BIZ_DSN="mysql+asyncmy://root:root123@127.0.0.1:3306/scm_biz?charset=utf8mb4" \
            python -X utf8 scripts/init_biz_db.py
          SCM_BIZ_DSN="mysql+asyncmy://root:root123@127.0.0.1:3306/scm_biz?charset=utf8mb4" \
            alembic -c backend/alembic_biz.ini upgrade head
          SCM_BIZ_DSN="mysql+asyncmy://root:root123@127.0.0.1:3306/scm_biz?charset=utf8mb4" \
            python -X utf8 scripts/seed_biz.py

      - name: Start platform (uvicorn background)
        run: |
          cd backend
          SCM_PLATFORM_DSN="mysql+asyncmy://root:root123@127.0.0.1:3306/scm_platform?charset=utf8mb4" \
          SCM_BIZ_DSN="mysql+asyncmy://root:root123@127.0.0.1:3306/scm_biz?charset=utf8mb4" \
          SCM_BIZ_RO_DSN="mysql+asyncmy://nl2sql_ro:ro_pass_2026_dev@127.0.0.1:3306/scm_biz?charset=utf8mb4" \
          SCM_JWT_SECRET="test-secret-for-day3" \
          SCM_SCHEDULER_ENABLED=0 \
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          sleep 6
          curl -sf http://127.0.0.1:8000/health || (echo "platform failed to start"; cat /tmp/uvicorn.log; exit 1)

      - name: SDK unit tests (offline)
        run: |
          cd sdk && python -m pytest tests/test_sdk_units.py -v

      - name: SDK integration tests (clean env vs real platform)
        run: |
          cd sdk && SCM_SDK_BASE_URL=http://127.0.0.1:8000 python -m pytest tests/test_sdk_integration.py -v
