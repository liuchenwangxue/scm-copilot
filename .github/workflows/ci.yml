# ★ W23 Day1：SCM Copilot CI 流水线：push/PR → Python 3.12 → ruff → mypy → pytest → coverage
#
# 设计（沿用 stage3 W21 经验）：
# - MySQL service container：host 名就是 service 名 `mysql`（不是 localhost）
#   → 连通性用例用 SCM_TEST_DSN=mysql+asyncmy://root:root123@mysql:3306/... 覆盖
# - CI 不做模型下载/网络访问（integration 以外的用例必须离线可跑）
# - coverage 生成 XML 报告上传
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: scm_platform
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov pytest-asyncio fastapi uvicorn \
            "sqlalchemy[asyncio]" asyncmy cryptography pydantic-settings httpx

      - name: ruff lint
        run: ruff check backend

      - name: mypy
        run: mypy --explicit-package-bases --namespace-packages backend

      - name: Debug MySQL (diagnose)
        run: |
          python scripts/diag_mysql.py \
            "mysql+asyncmy://root:root123@mysql:3306/scm_platform?charset=utf8mb4" \
          > /tmp/diag.out 2>&1 || { echo "::error::MYSQL_DIAG_FAIL"; cat /tmp/diag.out; exit 1; }
          cat /tmp/diag.out

      - name: pytest + coverage
        run: |
          SCM_TEST_DSN="mysql+asyncmy://root:root123@mysql:3306/scm_platform?charset=utf8mb4" \
          pytest backend/tests -v \
            --cov=backend --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage.xml
          if-no-files-found: error
