# ★ W23 SCM Copilot 平台服务编排（Day1 建仓 MySQL → Day6 扩容双实例 + nginx）
# 位置：deploy/docker-compose.yml ｜ 运行：make up-full（或 docker compose -f deploy/docker-compose.yml up -d --build）
#
# 设计要点：
# - 数据卷用【命名卷】而非绑定挂载：Windows + WSL2 下 NTFS 权限会导致 InnoDB 初始化失败
# - TZ 必须设：否则 DATETIME(3) 默认值差 8 小时，W24 "近7天"查询会全错
# - utf8mb4 + utf8mb4_unicode_ci：中文供应链数据唯一正确字符集
# - 宿主端口错开：mysql 13306 / redis 16381 / nginx 18000（本机 3306/16380/8000 已被他项目占用）
# - 无状态化（Day6）：backend 双实例同镜像不同容器，状态全在 MySQL/Redis；
#   nginx least_conn 分发；压测/杀实例演练入口
services:
  # ============ 平台权威库：MySQL 8（Day1） ============
  mysql:
    image: mysql:8.0
    container_name: scm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: scm_platform
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=500   # W23 Day6：双实例连接池 40+20/实例，承接压测峰值
      # W23 Day6 压测调优：并发写场景（审计/conversations 每请求 commit）在 Docker
      # Desktop 磁盘上默认 flush=1 每次 fsync → 40 并发长尾。开发环境降为每秒刷盘，
      # 生产纪律保留 flush=1（丢 1s 日志的容忍度随业务评估）
      - --innodb_flush_log_at_trx_commit=2
      - --innodb_buffer_pool_size=256M
    ports:
      - "${MYSQL_PORT:-13306}:3306"   # 宿主 13306 → 容器 3306（本机 3306 已被占用）
    volumes:
      - mysql_data:/var/lib/mysql
      # ★ W24 Day1：NL2SQL 只读账号初始化（仅首次建卷时执行，改密码需 down -v 重建）
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ============ Redis：幂等 / 语义缓存 / 锁（Day5 起强依赖，Day6 入编排） ============
  redis:
    image: redis:7-alpine
    container_name: scm-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-16381}:6379"   # 宿主 16381 → 容器 6379（本机 16380 已被 stage3 占用）
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ============ mock 业务系统：ops 域工具调用目标（Day6 随平台部署） ============
  mock-biz:
    build: ./mock_biz_server
    image: scm-mock-biz:latest
    container_name: scm-mock-biz
    restart: unless-stopped
    environment:
      PORT: "8794"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8794/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ============ backend 双实例（同镜像，无状态，least_conn 分发） ============
  backend-a1:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
    image: scm-backend:latest
    container_name: scm-backend-a1
    restart: unless-stopped
    environment: &backend_env
      # ★ W25 Day3 修复：backend 容器必须设 TZ=Asia/Shanghai——Python date.today() 走
      #   容器 OS 时区（默认 UTC），daily_brief/eval_nightly 按日期归属会少一天
      #   （实测容器手动触发 daily_brief 把 8/19 的日报写成了 8/18）。与 mysql 服务同款。
      TZ: Asia/Shanghai
      SCM_PLATFORM_DSN: "mysql+asyncmy://root:root123@mysql:3306/scm_platform?charset=utf8mb4"
      SCM_BIZ_DSN: "mysql+asyncmy://root:root123@mysql:3306/scm_biz?charset=utf8mb4"
      # ★ W25 Day6 修复：容器内 NL2SQL 沙箱需用 RO 账号连业务库（默认 127.0.0.1:13306
      #   指向容器自身 → Connection refused）。走 mysql 服务 + nl2sql_ro（initdb 建）
      SCM_BIZ_RO_DSN: "mysql+asyncmy://nl2sql_ro:ro_pass_2026_dev@mysql:3306/scm_biz?charset=utf8mb4"
      SCM_JWT_SECRET: "dev-secret-change-me"
      REDIS_URL: "redis://redis:6379/0"
      # ★ W25 Day3 修复：settings 字段 instance_id 对应环境变量前缀 SCM_（env_prefix="SCM_"），
      #   旧值 INSTANCE_ID 读取不到 → 双实例 job_runs 的 instance 字段都是 "local"，
      #   24h 零重复观测无法区分实例。改为 SCM_INSTANCE_ID 后 a1/a2 各留独立实例名。
      SCM_INSTANCE_ID: "backend-a1"
      LLM_PROVIDER: "mock"                 # 压测零成本：mock LLM 兜底（真实 LLM 留 W24 采样）
      BIZ_BASE_URL: "http://mock-biz:8794" # 容器内互访走 compose 网络
      CHECKPOINTER_BACKEND: "mysql"        # AsyncMySaver（平台库 scm_platform）
      KB_DATA_DIR: "/data"
      REPORTS_DIR: "/reports"
      AUDIT_LOG: "/data/audit.log"
      IDEMPOTENCY_DB: "/data/idempotency.db"
      STRUCT_LOG: "/reports/struct.log.jsonl"
      # ★ W23 Day6 压测优化：容器内关结构化日志（obs handler 是同步文件 IO + 线程锁，
      #   Docker volume 上写盘慢，20 并发/实例下阻塞事件循环造成 P95 长尾；观测留本地/W26）
      STRUCT_LOG_ENABLED: "0"
      # ★ W28-D1（容器口径统一 C1）：容器内跑真 embedding + 真 reranker——
      #   语义缓存开启（真模型下命中才有意义）；模型文件来自 model-cache 卷
      #   （本机下载好的 bge-small/bge-reranker 拷入卷，镜像不膨胀）。
      SCM_EMBEDDER: "real"
      SCM_RERANKER: "bge"                  # a1 真 reranker（1.1GB 挂载）
      SEMANTIC_CACHE_ENABLED: "1"
      SEMANTIC_ROUTER_ENABLED: "1"         # 语义路由规则层零 embedding，kb 压测走 chat/tool 分支
      # ★ W28-D1：Qdrant 访问路径——容器内 localhost 指容器自身，走宿主转发的
      #   w5-qdrant（本机 6333 端口，scm_kb_v1 collection 所在；与本地开发同库，
      #   保证"容器内外同语料"口径）。Windows Docker Desktop 支持 host.docker.internal；
      #   生产环境应替换为 compose 内专用 qdrant 服务（如 w5-qdrant 独立部署）。
      QDRANT_URL: "http://host.docker.internal:6333"
      OTEL_ENABLED: "0"
    volumes:
      - runtime_data:/data
      - runtime_reports:/reports
      - model-cache:/root/.cache           # ★ W28-D1：bge 模型卷（HF 缓存位）
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8795/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      # ★ W28-D1：start_period 放宽——/health 首次探活会触发模型加载探测
      #   （bge-small ~3s + bge-reranker ~5-10s），30s 不够需 60s
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-biz:
        condition: service_healthy

  backend-a2:
    image: scm-backend:latest
    container_name: scm-backend-a2
    restart: unless-stopped
    environment:
      <<: *backend_env
      SCM_INSTANCE_ID: "backend-a2"
      # ★ W28-D1：a2 保持规则重排（RuleReranker）——1.1GB reranker 只挂 a1，
      #   /health 可见两实例差异 = 分级降级演示素材；embedding 100MB 双实例共享。
      SCM_RERANKER: "rule"
    volumes:
      - runtime_data:/data
      - runtime_reports:/reports
      - model-cache:/root/.cache           # ★ W28-D1：bge 模型卷（HF 缓存位）
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-biz:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8795/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      # ★ W28-D1：start_period 放宽（/health 首次探活触发模型加载探测）
      start_period: 60s

  # ============ nginx：least_conn 负载均衡（Day6）+ TLS（W25 Day6） ============
  nginx:
    image: nginx:1.27-alpine
    container_name: scm-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-18000}:80"          # 宿主 18000 → 容器 80（本机 8000 已被 stage3 占用）
      - "${NGINX_HTTPS_PORT:-18443}:443"   # ★ W25 Day6：https 入口（mkcert 本地 TLS）
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # ★ W25 Day6：mkcert 生成的本地证书（`make tls` 生成，无证书时 nginx 仍可起
      #   （80 端口不依赖证书；443 会因缺证书启动失败——`make up` 前先跑 `make tls`）
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend-a1
      - backend-a2
    healthcheck:
      # ★ W25 Day6 修复：80 端口已 301 跳转 https，busybox wget 跟随重定向后因
      #   mkcert 证书不在容器信任库 → SSL verify failed。改直接探 https（--no-check-certificate）
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ============ Gradio 前端（★ W28 Day2：浏览器可演示三页） ============
  # 走 SCM SDK 0.2.0 直连后端（经 nginx https 入口）；nginx 反代 /ui 到本服务 7860。
  # 演示口径：浏览器打开 https://localhost:18443/ui → 登录 API Key → 对话/审批/日报。
  gradio:
    build:
      context: ..
      dockerfile: deploy/frontend/Dockerfile
    image: scm-frontend:latest
    container_name: scm-gradio
    restart: unless-stopped
    environment:
      # ★ 前端容器内访问后端：经 nginx（https 入口，负载均衡到双实例）。
      #   SDK verify=False：nginx 容器内证书是 mkcert 本地自签（前端是自有服务，
      #   信任链在宿主；容器内直连关闭证书校验——生产换真实证书后应 verify=True）。
      SCM_BASE_URL: "https://nginx:443"
      SCM_FRONTEND_PORT: "7860"
      SCM_ROOT_PATH: "/ui"
    ports:
      - "${FRONTEND_PORT:-17860}:7860"   # 宿主 17860 → 容器 7860（避开常用端口）
    depends_on:
      - nginx
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:7860',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ============ 监控（★ W25 Day6 三吸收项：基础监控） ============
  # Prometheus 拉模型抓三组：backend 应用 /metrics + node-exporter（宿主机）+ cAdvisor（容器）
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: scm-node-exporter
    restart: unless-stopped
    # ★ 手册坑：Windows Docker Desktop 下 node-exporter 监控的是 Docker 宿主 VM
    #   （Linux），不是 Windows 宿主机——"主机 CPU/内存"曲线反映的是 VM 而非真机。
    #   对"容器资源占用"监控 cAdvisor 更直接；node-exporter 保留作标准抓取目标。
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9100/metrics"]
      interval: 15s
      timeout: 3s
      retries: 3

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: scm-cadvisor
    restart: unless-stopped
    # ★ 手册坑：cAdvisor 在 Windows Docker Desktop 下对 Windows 容器无效，
    #   只监控 linux 容器（backend/mysql/redis 都是 linux，没问题）
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: scm-prometheus
    restart: unless-stopped
    depends_on:
      - backend-a1
      - backend-a2
    ports:
      - "${PROMETHEUS_PORT:-19090}:9090"   # 本机 http://localhost:19090/targets 看抓取状态
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"  # 指标保留 7 天（足够压测/回归用）

  grafana:
    image: grafana/grafana:11.2.2
    container_name: scm-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT:-13001}:3000"      # 默认 13001（避开 stage3 的 3001/langfuse 3300）
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin123}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
    name: scm_mysql_data
  redis_data:
    name: scm_redis_data
  runtime_data:      # 容器内审计日志/幂等兜底 sqlite（权威数据在 MySQL/Redis，这里只是可写区）
    name: scm_runtime_data
  runtime_reports:
    name: scm_runtime_reports
  # ★ W28-D1：bge 模型卷——本机下载好的 bge-small/bge-reranker 拷入
  #   （/root/.cache/huggingface/hub/...），backend 双实例共享；用命名卷而非
  #   bind mount（Windows Docker Desktop 大模型目录 bind IO 慢，手册坑）
  model-cache:
    name: scm_model_cache
  prometheus_data:
    name: scm_prometheus_data
  grafana_data:
    name: scm_grafana_data
