# Grafana 数据源自动配置（W25 Day6 Prometheus；★ W26 Day1 加 MySQL 业务数据源）
#
# ★ W26 Day1 手册坑：MySQL datasource 直连查 eval_reports 最简单（Grafana MySQL 插件），
#   别为了一致性硬上 exporter——业务面板的"NL2SQL 质量 / 队列与调度"两区用 MySQL 数据源
#   直查平台库（eval_reports / scheduler_job_runs），零埋点、零延迟。
#
# 连接说明（compose 内网）：mysql:3306（服务名解析到容器）；root 仅开发环境。
#   生产应换只读账号（如 nl2sql_ro 仅 SELECT 业务库；平台库需单独建只读账号）。
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: MySQL
    uid: scm-mysql
    type: mysql
    access: proxy
    url: mysql:3306
    user: root
    secureJsonData:
      password: root123
    jsonData:
      database: scm_platform
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      timeout: 10
    editable: false
