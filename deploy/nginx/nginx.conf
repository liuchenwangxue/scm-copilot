# ★ W23 Day6：least_conn 双实例负载均衡（真无状态的水平扩展入口）
#
# 设计（对齐手册 Day6 + W20 教训）：
# - upstream least_conn：状态全外置后不再需要 ip_hash 粘滞（无状态化核销清单前置）
# - proxy_buffering off：保 SSE 流式（W20 教训：nginx 缓冲会吃满内存且延迟事件到达）
# - proxy_read_timeout 300s：SSE 长连接 / LLM 慢生成不超时
# - X-Request-Id 透传 $request_id：双实例日志交错时的贯穿排查标识（手册 Day6 坑）
upstream backend {
    least_conn;
    server backend-a1:8795;
    server backend-a2:8795;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 双实例日志贯穿：无客户端头时用 nginx 生成的 $request_id，有则透传
        proxy_set_header X-Request-Id $request_id;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 5s;
        # ★ 杀实例不中断：转发失败（连接拒绝/超时/502/503）自动切下一个 upstream，
        #   对新请求透明无缝；in-flight 已流式传输的请求会断（SSE 语义，允许重试）
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
