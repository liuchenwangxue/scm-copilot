# ★ W23 Day6：least_conn 双实例负载均衡（真无状态的水平扩展入口）
# ★ W25 Day6：本地 TLS（mkcert）——80 → 301 → 443；SSE 在 https 下 proxy_buffering off 仍生效
#
# 设计（对齐手册 Day6 + W20 教训）：
# - upstream least_conn：状态全外置后不再需要 ip_hash 粘滞（无状态化核销清单前置）
# - proxy_buffering off：保 SSE 流式（W20 教训：nginx 缓冲会吃满内存且延迟事件到达）
# - proxy_read_timeout 300s：SSE 长连接 / LLM 慢生成不超时
# - X-Request-Id 透传 $request_id：双实例日志交错时的贯穿排查标识（手册 Day6 坑）
# - ★ TLS（W25 Day6）：
#   · 443 挂 mkcert 本地证书（deploy/nginx/certs/，`make tls` 生成；生产换正式证书）
#   · 80 → 301 永久跳转 https（SSE 也走 https——浏览器 EventSource 只认 http(s)）
#   · ssl_certificate 缺文件时 nginx 启动失败 → compose 依赖 `make tls` 先跑
upstream backend {
    least_conn;
    server backend-a1:8795;
    server backend-a2:8795;
}

# ---- HTTP：一律 301 到 HTTPS ----
server {
    listen 80;
    server_name localhost scm.local _;
    return 301 https://$host$request_uri;
}

# ---- HTTPS：真正的服务入口 ----
server {
    listen 443 ssl;
    http2 on;
    server_name localhost scm.local _;

    # mkcert 本地证书（CN 含 localhost + scm.local——手册坑：要含实际访问的 hostname）
    ssl_certificate     /etc/nginx/certs/localhost+2.pem;
    ssl_certificate_key /etc/nginx/certs/localhost+2-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ★ https 反代必须透传原始协议（后端生成回链/SSE 事件地址时依赖）
        proxy_set_header X-Forwarded-Proto $scheme;
        # 双实例日志贯穿：无客户端头时用 nginx 生成的 $request_id，有则透传
        proxy_set_header X-Request-Id $request_id;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 5s;
        # ★ 杀实例不中断：转发失败（连接拒绝/超时/502/503）自动切下一个 upstream，
        #   对新请求透明无缝；in-flight 已流式传输的请求会断（SSE 语义，允许重试）
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # ★ W28 Day2：Gradio 前端反代（/ui → gradio 服务 7860）。
    #   坑（手册 Day2）：gradio 走 SSE + websocket（/queue/join），必须
    #   · proxy_buffering off 保留（SSE 不缓冲）
    #   · proxy_set_header Host $host（websocket 升级校验 Host）
    #   · Upgrade/Connection 头透传（websocket 握手）
    #   · proxy_pass 尾斜杠 = 去掉 /ui 前缀（gradio 以 root_path=/ui 生成资源路径）
    location /ui/ {
        proxy_pass http://gradio:7860/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 5s;
    }
}
